<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILJIN WMS – Phase 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=202610291934">
  <link rel="stylesheet" href="css/layout.css?v=202610291934">
  <link rel="stylesheet" href="css/admin.css?v=202610291934">
  <style>
    .phase2 { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(11, 26, 92, .06); padding: 48px 24px; text-align: center; max-width: 640px; margin: 40px auto; }
    .phase2 .ico { font-size: 3rem; }
    .phase2 .tag { display: inline-block; background: #fff4ee; color: var(--orange-dark); font-weight: 700; padding: 6px 16px; border-radius: 20px; margin: 14px 0; }
    .phase2 h2 { color: var(--navy-dark); font-size: 1.6rem; }
    .phase2 p { color: var(--muted); max-width: 460px; margin: 0 auto; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <section class="phase2" id="phase2"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/data/workers.js?v=202610291934"></script>
  <script src="js/utils.js?v=202610291934"></script>
  <script src="js/store.js?v=202610291934"></script>
  <script src="js/sidebar.js?v=202610291934"></script>
  <script src="js/admin.js?v=202610291934"></script>
  <script>
    // Placeholder for modules still under discussion with ILJIN
    const MODULES = {
      skills: { icon: "📊", title: "Skill Matrix", text: "Department-wise skill matrix (9 skills, Level 1–4), quarterly assessments and TNI." },
      licenses: { icon: "🪪", title: "Operator Licenses", text: "Operator license cards with unique ID / QR, issued after skill certification." },
    };
    const m = MODULES[new URLSearchParams(location.search).get("m")] || MODULES.skills;
    document.title = `ILJIN WMS – ${m.title}`;
    document.getElementById("phase2").innerHTML = `
      <div class="ico">${m.icon}</div>
      <span class="tag">Phase 2 · In discussion</span>
      <h2>${m.title}</h2>
      <p>${m.text} Scope and rules are being finalised with the ILJIN team.</p>`;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ILJIN Worker Management System – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-page">
    <!-- Brand panel -->
    <section class="brand-panel">
      <span class="eyebrow">ILJIN Electronics</span>
      <h1>Worker Management System</h1>
      <div class="accent-line"></div>
      <p>Skill matrix, training and operator licensing for every worker on every line.</p>
      <img class="brand-art" src="img/chip.svg" alt="" aria-hidden="true">
    </section>

    <!-- Login panel -->
    <section class="form-panel">
      <div class="login-card">
        <header class="login-header">
          <img class="logo" src="../assets/logo/iljin_logo.png" alt="ILJIN">
          <h2>Sign in</h2>
        </header>

        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="worker" role="tab">Worker</button>
          <button class="tab" data-tab="staff" role="tab">Staff</button>
        </div>

        <!-- Worker login: Employee ID + DOB -->
        <form id="worker-form" class="login-form active">
          <label for="emp-id">Employee ID</label>
          <input id="emp-id" type="text" placeholder="e.g. PE1424" required>

          <label for="dob">Date of Birth</label>
          <input id="dob" type="date" required>

          <button type="submit" class="btn">View My Profile</button>
        </form>

        <!-- Staff login: Email + Password -->
        <form id="staff-form" class="login-form">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="hr@iljin.com" required>

          <label for="password">Password</label>
          <input id="password" type="password" required>

          <button type="submit" class="btn">Login</button>
        </form>

        <p id="message" class="message"></p>

        <!-- Pilot demo credentials -->
        <div class="demo-note">
          <strong>Pilot Version – Demo Login</strong>
          <p><span>Worker:</span> ID <code>PE1424</code> · DOB <code>08-04-2002</code></p>
          <p><span>Staff:</span> <code>hr@iljin.com</code> · <code>admin123</code></p>
        </div>
      </div>

      <footer class="login-footer">
        <span>An</span>
        <img src="../assets/logo/amber_logo.png" alt="Amber">
        <span>Group Company</span>
      </footer>
    </section>
  </main>

  <script src="js/data/workers.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

<body>
  <aside class="sidebar" id="sidebar" data-page="induction"></aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>HR Induction</h1>
        <p class="sub">Day-1 orientation – company, products, process & safety</p>
      </div>
      <div class="top-actions"><div id="lang"></div><button class="present-btn" id="present-btn" title="Full screen presentation">⛶ Present</button></div>

    <div class="pilot-note">Pilot: dummy orientation content – upload ILJIN's official induction PPT below.</div>

    <div class="induction">

      <nav class="modules" id="modules"></nav>

      <!-- Slide viewer -->
      <section class="viewer" id="viewer">
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="slide-area" id="slide"></div>
        <footer class="viewer-foot">
          <button class="nav-btn" id="prev">← Previous</button>
          <div class="dots" id="dots"></div>
          <button class="nav-btn primary" id="next">Next →</button>
        </footer>
      </section>
    </div>

    <!-- Induction Test -->
    <section class="test-wrap" id="induction-test">
      <header class="test-header">
        <div>
          <h2>Induction Test</h2>
          <p>Bilingual MCQ + subjective · scan QR or enter Employee ID</p>
        </div>
        <span class="doc">Doc 01-HRD40-F-36</span>
      </header>
      <div class="test-upload" id="test-upload"></div>
      <div class="test-body" id="test-body"></div>
    </section>
